[project]
name = "crypto-daytrade"
version = "0.1.0"
description = "Paper-only Bybit spot day-trade desk for a Brazil Standard Account."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
desk = "desk.cli:main"

[tool.setuptools]
packages = ["desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
